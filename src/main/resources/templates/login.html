<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito | DelCap Itajaí</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@300;400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

<div class="login-wrapper">

    <!-- ── ÍCONE ───────────────────────────────────────────── -->
    <div class="login-icon">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"
             fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="16" y="28" width="32" height="24" rx="2"/>
            <path d="M24 28v-8a8 8 0 0 1 16 0v8"/>
            <circle cx="32" cy="40" r="3"/>
            <line x1="32" y1="43" x2="32" y2="47"/>
        </svg>
    </div>

    <!-- ── CABEÇALHO ──────────────────────────────────────── -->
    <div class="login-header">
        <p class="eyebrow">Sistema Restrito</p>
        <h1>Acesso <em>PSCO</em></h1>
        <p class="login-sub">DelCap Itajaí — Marinha do Brasil</p>
    </div>

    <!-- ================================================================
         MENSAGENS DO SPRING SECURITY
         ?error  → login falhou (usuário/senha incorretos)
         ?logout → usuário fez logout com sucesso

         th:if="${param.error}": verifica se o parâmetro "error"
         existe na URL — o Spring Security adiciona automaticamente
         quando o login falha (/login?error)
    ================================================================ -->
    <div th:if="${param.error}" class="login-msg login-msg-erro">
        Usuário ou senha incorretos.
    </div>
    <div th:if="${param.logout}" class="login-msg login-msg-sucesso">
        Sessão encerrada com sucesso.
    </div>

    <!-- ================================================================
         FORMULÁRIO DE LOGIN
         action="/login": o Spring Security processa este POST.
         Os campos DEVEM se chamar "username" e "password" —
         são os nomes que o Spring Security espera por padrão.
    ================================================================ -->
    <form action="/login" method="post" class="login-form">

        <!--
            CSRF Token — proteção contra Cross-Site Request Forgery.
            O Spring Security gera um token único por sessão e
            verifica se ele está presente no POST.
            O Thymeleaf injeta automaticamente com th:action.
            Como usamos action= (sem th:), precisamos injetar manual.
        -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div class="login-group">
            <label class="login-label">Usuário</label>
            <input type="text"
                   name="username"
                   class="login-input"
                   placeholder="Digite seu usuário"
                   autocomplete="username"
                   autofocus
                   required>
        </div>

        <div class="login-group">
            <label class="login-label">Senha</label>
            <input type="password"
                   name="password"
                   class="login-input"
                   placeholder="Digite sua senha"
                   autocomplete="current-password"
                   required>
        </div>

        <button type="submit" class="btn-primary login-btn">
            Entrar →
        </button>

    </form>

    <div class="login-footer">
        <a href="/" class="login-voltar">← Voltar ao início</a>
    </div>

</div>

<script src="/js/global.js"></script>
</body>
</html>
